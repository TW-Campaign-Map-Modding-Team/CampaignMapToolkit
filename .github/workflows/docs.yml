name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      # docs/user-guides.md is the in-app help index; reuse it as the wiki
      # landing page (Home.md) and as the wiki's left-hand nav (_Sidebar.md),
      # in addition to publishing every guide under its own page name so
      # in-app help links (which point at the .md filenames) keep working.
      - name: Build wiki content
        run: |
          rm -rf /tmp/wiki-content
          mkdir -p /tmp/wiki-content
          cp docs/*.md /tmp/wiki-content/
          cp docs/user-guides.md /tmp/wiki-content/Home.md
          cp docs/user-guides.md /tmp/wiki-content/_Sidebar.md

      - name: Sync into wiki checkout
        run: rsync -a --delete --exclude='.git' /tmp/wiki-content/ wiki/

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No doc changes to publish."
          else
            git commit -m "Sync docs from ${{ github.sha }}"
            git push
          fi
